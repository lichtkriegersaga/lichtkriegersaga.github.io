      "title": "I. Das Kind das lauschte",
      "text": "Es gibt eine Stille in den alten Wäldern,\ndie kein anderer Ort der Welt kennt.\n\nNicht die Stille der Leere.\nDie Stille des Vollen.\nAls würde der Wald atmen — und du hörst es,\nwenn du still genug bist.\n\nIch wurde im Silberwald geboren, weit im Westen,\nwo die Bäume älter sind als die Götter\nund bis hinunter ans graue Meer reichen.\nEs war Frühling. An den Ästen hing noch Schnee.\n\nDie Hebamme sagte: \"Das Kind weint nicht.\"\n\nMeine Mutter, die Heilerin des Dorfes, schaute mich an und verstand sofort.\nIch weinte nicht, weil ich nicht erschrocken war.\nIch weinte nicht, weil ich — lauschte.\n\n\"Filli,\" sagte sie. \"Die Sanfte.\"\n\nNicht weil ich schwach war.\nWeil ich schon wusste: Manche Dinge hört man nur, wenn man nicht schreit.\n\nMein Haar war schwarz wie der Wald in der Nacht,\nmit Strähnen darin wie Glut unter Asche —\ndas Erbe meiner Grossmutter, die auch eine Seherin war.\nMeine Augen: honigbraun wie Bernstein im Mondlicht.\nUnd auf meiner Nase ein paar Sommersprossen,\nals hätte der Frühling mich im Vorbeigehen berührt.\n\nIch war das ruhigste Kind im Dorf.\nNicht still. Ruhig.\nDas ist nicht dasselbe.\n",

      "img": "../assets/filli_p06.jpg",

    },
    {

      "img": "../assets/filli_p07.jpg",
      "wide": true
    },
    {
      "type": "spread",
      "title": "VIII. Der Aufbruch",

      "img": "../assets/filli_p08.jpg",
      "wide": true
    },
    {
      "type": "spread",

      "img": "../assets/filli_p09.jpg",

    },

let lang = localStorage.getItem("filli_lang") || "de";
let i = 0;
const spread = document.getElementById("spread");
const stage = document.getElementById("stage");
const pager = document.getElementById("pager");
const prev = document.getElementById("prev");
const next = document.getElementById("next");

function esc(s) {
  return String(s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function applyUI() {
  const u = UI[lang];
  document.documentElement.lang = lang;
  document.getElementById("doc-title").textContent = u.title;
  document.getElementById("doc-sub").textContent = u.sub;
  document.getElementById("doc-hint").textContent = u.hint;
  prev.textContent = u.prev;
  const bh = document.getElementById("back-home");
  if (bh) bh.textContent = (lang === "de" ? "‹ Bücherwand" : "‹ Bookshelf");
  next.textContent = u.next;
  document.getElementById("lang-de").classList.toggle("active", lang === "de");
  document.getElementById("lang-en").classList.toggle("active", lang === "en");
}

function render() {
  const pages = PAGES[lang];
  const p = pages[i];
  if (p.type === "cover") {
    stage.classList.remove("wide-mode");
    spread.className = "spread";
    spread.innerHTML = `<div class="page cover-wrap"><img src="${esc(p.img)}" alt="Cover"/></div>`;
  } else {
    const wide = !!p.wide;
    stage.classList.toggle("wide-mode", wide);
    spread.className = "spread" + (wide ? " landscape" : "");
    spread.innerHTML = `
      <div class="page left"><h2>${esc(p.title)}</h2><div class="body">${esc(p.text)}</div></div>
      <div class="page right"><img src="${esc(p.img)}" alt="${esc(p.title)}"/></div>`;
  }
  pager.textContent = `${i + 1} / ${pages.length}`;
  prev.disabled = i === 0;
  next.disabled = i === pages.length - 1;
}
function setLang(l) {
  lang = l;
  localStorage.setItem("filli_lang", lang);
  applyUI();
  render();
}
document.getElementById("lang-de").onclick = () => setLang("de");
document.getElementById("lang-en").onclick = () => setLang("en");
prev.onclick = () => { if (i > 0) { i--; render(); } };
next.onclick = () => { if (i < PAGES[lang].length - 1) { i++; render(); } };
document.addEventListener("keydown", (e) => {
  if (e.key === "ArrowLeft") prev.click();
  if (e.key === "ArrowRight") next.click();
});
applyUI();
render();
