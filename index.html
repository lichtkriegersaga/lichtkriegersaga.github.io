<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png"/>
<link rel="icon" type="image/png" href="assets/favicon.png"/>
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png"/>
<style>
  :root {
    --parchment: #f3e6c8;
    --ink: #1a120c;
    --gold: #c9a227;
    --brass: #8a6a3a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    background: #0d0805;
    color: var(--parchment);
    font-family: "Palatino Linotype", Palatino, Georgia, serif;
    overflow-x: hidden;
  }
  .lang-switch {
    position: fixed; top: .75rem; right: .75rem; z-index: 30;
    display: flex; gap: .25rem;
  }
  .lang-switch button {
    background: #2a1810; color: var(--parchment);
    border: 1px solid var(--brass); border-radius: 3px;
    padding: .3rem .55rem; font: inherit; font-size: .75rem; cursor: pointer;
    letter-spacing: .06em;
  }
  .lang-switch button.active { background: var(--gold); color: #1a0e08; border-color: var(--gold); }
  header {
    text-align: center;
    padding: 1rem 1rem .5rem;
  }
  header h1 {
    margin: 0;
    font-size: 1.15rem;
    letter-spacing: .12em;
    color: var(--gold);
    font-weight: 600;
  }
  header p { margin: .35rem 0 0; opacity: .65; font-size: .85rem; }
  .hint {
    text-align: center;
    font-size: .8rem;
    opacity: .55;
    margin: 0 0 1rem;
  }

  .stage { display: none; min-height: 78vh; }
  .stage.active { display: block; }

  #stage-shelf {
    position: relative;
    width: min(1100px, 96vw);
    margin: 0 auto;
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 20px 50px rgba(0,0,0,.6);
    background: #0d0805;
  }
  .shelf-scene {
    position: relative;
    width: 100%;
    aspect-ratio: 16/9;
    overflow: hidden;
    border-radius: 8px;
  }
  .shelf-scene .bg {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    object-position: center 55%;
  }
  /* —— Bücherwand spines (data-driven) —— */
  .shelf-rows {
    position: absolute;
    left: 15%;
    right: 10%;
    bottom: 20.5%;
    height: 42%;
    z-index: 4;
    display: flex;
    flex-direction: column-reverse; /* bottom shelf first */
    justify-content: flex-start;
    gap: 3%;
    pointer-events: none;
    overflow-x: auto;
    overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: thin;
    scrollbar-color: #8a6a3a transparent;
  }
  .spine-row {
    display: flex;
    flex-direction: row;
    align-items: flex-end;
    justify-content: flex-start;
    gap: clamp(4px, 0.55vw, 8px);
    height: 100%;
    min-height: 140px;
    pointer-events: auto;
    padding: 0 2px 0;
  }
  .spine {
    --spine-w: clamp(36px, 4.4vw, 54px);
    width: var(--spine-w);
    height: 100%;
    position: relative;
    flex: 0 0 auto;
    border-radius: 2px 3px 2px 2px;
    cursor: default;
    transform-origin: bottom center;
    transition: transform .28s ease, filter .28s ease, box-shadow .28s ease;
    box-shadow:
      inset 2px 0 3px rgba(255,255,255,.08),
      inset -3px 0 5px rgba(0,0,0,.45),
      2px 4px 10px rgba(0,0,0,.55);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 5% 0 1%;
    overflow: hidden;
    border: 1px solid rgba(0,0,0,.35);
    border-left-color: rgba(255,220,150,.12);
    border-right-color: rgba(0,0,0,.5);
  }
  .spine::before {
    /* raised bands */
    content: "";
    position: absolute; inset: 0;
    background:
      linear-gradient(90deg, rgba(0,0,0,.35), transparent 18%, transparent 82%, rgba(0,0,0,.4)),
      repeating-linear-gradient(
        180deg,
        transparent 0 14%,
        rgba(0,0,0,.28) 14% 16%,
        rgba(255,220,160,.06) 16% 17%,
        transparent 17% 33%
      );
    pointer-events: none;
  }
  .spine.ready {
    cursor: pointer;
    filter: brightness(1.08) saturate(1.05);
    box-shadow:
      inset 2px 0 3px rgba(255,255,255,.12),
      inset -3px 0 5px rgba(0,0,0,.4),
      0 0 14px rgba(201,162,39,.28),
      2px 6px 14px rgba(0,0,0,.55);
  }
  .spine.ready:hover,
  .spine.ready:focus-visible {
    transform: translateY(-10px) translateX(2px) scale(1.03);
    filter: brightness(1.16) saturate(1.08);
    outline: none;
    z-index: 6;
  }
  .spine.ready:active {
    transform: translateY(-6px) translateX(4px);
  }
  .spine.soon {
    opacity: .88;
    filter: none;
    cursor: default;
  }
  .spine.soon::after {
    content: "";
    position: absolute; inset: 0;
    background: rgba(0,0,0,.28);
    pointer-events: none;
    z-index: 1;
  }
  .spine.soon .spine-emblem { z-index: 3; }
  .spine.soon .spine-titles { opacity: .72; }
  .spine.soon .spine-emblem {
    opacity: 1;
    filter: saturate(1.05) brightness(1.05);
  }
  .spine-emblem {
    position: relative;
    z-index: 2;
    width: 58%;
    aspect-ratio: 1;
    border-radius: 50%;
    border: 1.5px solid #c9a227;
    box-shadow:
      0 0 0 1px #1a0e08,
      0 0 6px rgba(201,162,39,.35),
      inset 0 1px 2px rgba(255,240,180,.25);
    background:
      radial-gradient(circle at 35% 30%, #3a2818, #1a100a 70%);
    overflow: hidden;
    flex-shrink: 0;
    margin-bottom: 6%;
  }
  .spine-emblem img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
  }
  .spine-emblem.empty {
    background:
      radial-gradient(circle at 35% 30%, #2a1c12, #120c08 75%);
    box-shadow:
      0 0 0 1px #1a0e08,
      inset 0 0 6px rgba(0,0,0,.6),
      inset 0 1px 1px rgba(201,162,39,.15);
  }
  .spine-emblem.empty::after {
    content: "";
    position: absolute; inset: 22%;
    border-radius: 50%;
    border: 1px solid rgba(201,162,39,.28);
    box-shadow: inset 0 0 4px rgba(0,0,0,.5);
  }
  .spine-titles {
    position: relative;
    z-index: 2;
    flex: 1 1 auto;
    display: flex;
    flex-direction: row;
    flex-wrap: nowrap;
    align-items: flex-start;
    justify-content: center;
    gap: 3px;
    min-height: 0;
    width: 100%;
    overflow: hidden;
  }
  .spine-title,
  .spine-subtitle {
    writing-mode: vertical-rl;
    text-orientation: mixed;
    transform: rotate(180deg);
    color: #f0e0a8;
    font-weight: 600;
    text-shadow: 0 1px 2px rgba(0,0,0,.85);
    text-align: center;
    white-space: nowrap;
    overflow: visible;
    line-height: 1;
    padding: 0;
  }
  .spine-title {
    font-size: clamp(.72rem, 1.45vw, .95rem);
    letter-spacing: .18em;
  }
  .spine-subtitle {
    font-size: clamp(.36rem, .72vw, .5rem);
    letter-spacing: .06em;
    font-weight: 500;
    color: #e8d08acc;
    opacity: .92;
    max-height: 100%;
  }
  .spine.soon .spine-title { color: #d4b86a; opacity: .9; }
  .spine.soon .spine-subtitle { color: #c9a22799; }
  .spine.has-subtitle { --spine-w: clamp(40px, 4.8vw, 58px); }
  .spine .spine-emblem img,
  .spine .spine-emblem object {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
  }
  .spine-accent {
    /* tiny gold line under emblem */
    position: relative; z-index: 2;
    width: 55%; height: 2px;
    margin-bottom: 8%;
    background: linear-gradient(90deg, transparent, #c9a227, transparent);
    opacity: .7;
  }

  #stage-table {
    position: relative;
    width: min(1100px, 96vw);
    margin: 0 auto;
    aspect-ratio: 16/9;
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 20px 50px rgba(0,0,0,.6);
  }
  #stage-table .bg {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
  }
  #book-on-table {
    position: absolute;
    left: 50%; top: 52%;
    transform: translate(-50%, -50%);
    width: min(580px, 56%);
    height: auto;
    max-height: 70%;
    cursor: pointer;
    transition: transform .35s ease;
    animation: land .8s ease;
    background: transparent;
    border: none;
    box-shadow: none;
  }
  #book-on-table:hover { transform: translate(-50%, -54%) scale(1.03); }
  #book-on-table img {
    width: 100%;
    height: auto;
    max-height: 68vh;
    object-fit: contain;
    display: block;
    background: transparent;
    border: none;
    border-radius: 0;
    filter: drop-shadow(0 18px 28px rgba(0,0,0,.78)) drop-shadow(0 4px 10px rgba(0,0,0,.5));
  }
  @keyframes land {
    from { opacity: 0; transform: translate(-50%, -80%) scale(.7) rotate(-8deg); }
    to { opacity: 1; transform: translate(-50%, -50%) scale(1) rotate(0); }
  }
  .table-caption {
    position: absolute;
    bottom: 8%; left: 0; right: 0;
    text-align: center;
    color: var(--gold);
    text-shadow: 0 2px 8px #000;
    font-size: .95rem;
  }

  #stage-open {
    width: min(960px, 96vw);
    margin: 0 auto;
  }
  #stage-open.wide-mode { width: min(1100px, 96vw); }
  .spread {
    width: 100%;
    aspect-ratio: 3/2;
    max-height: 70vh;
    display: grid;
    grid-template-columns: 1fr 1fr;
    border-radius: 6px 10px 10px 6px;
    overflow: hidden;
    box-shadow:
      0 0 0 3px #1a0e08,
      0 0 0 6px var(--brass),
      0 25px 60px rgba(0,0,0,.65);
    background: #2a1810;
  }
  .spread.landscape {
    grid-template-columns: 1fr;
    grid-template-rows: minmax(0, 1.05fr) minmax(0, .95fr);
    aspect-ratio: 16/10;
  }
  .page {
    background: var(--parchment);
    color: var(--ink);
    padding: 1.3rem 1.4rem;
    overflow: auto;
  }
  .page.left {
    border-right: 1px solid #cbb892;
    background: linear-gradient(90deg, rgba(0,0,0,.07), transparent 14%), var(--parchment);
  }
  .spread.landscape .page.left {
    border-right: none;
    border-bottom: 1px solid #cbb892;
    order: 2;
  }
  .page.right {
    display: flex; align-items: center; justify-content: center;
    padding: .5rem;
    background: linear-gradient(270deg, rgba(0,0,0,.06), transparent 14%), var(--parchment);
  }
  .spread.landscape .page.right {
    order: 1;
    padding: .35rem;
    background: #1a120c;
  }
  .page h2 {
    margin: 0 0 .7rem;
    font-size: 1.1rem;
    color: #5a3a18;
    border-bottom: 1px solid #c9a22766;
    padding-bottom: .35rem;
  }
  .page .body {
    font-size: clamp(.75rem, 1.3vw, .92rem);
    line-height: 1.55;
    white-space: pre-wrap;
  }
  .page.right img {
    max-width: 100%; max-height: 100%;
    object-fit: contain;
    border: 1px solid #b89a5a44;
  }
  .spread.landscape .page.right img {
    width: 100%; height: 100%;
    object-fit: contain;
    border: none;
  }
  .nav {
    margin-top: 1rem;
    display: flex; gap: .7rem; align-items: center; justify-content: center; flex-wrap: wrap;
  }
  button {
    background: linear-gradient(180deg, #5a3a22, #2a1810);
    color: var(--parchment);
    border: 1px solid var(--brass);
    border-radius: 4px;
    padding: .5rem 1rem;
    font: inherit; cursor: pointer;
  }
  button:hover { filter: brightness(1.12); }
  button:disabled { opacity: .35; cursor: default; }
  .pager { min-width: 6rem; text-align: center; color: var(--gold); font-size: .9rem; }
  .back-shelf { opacity: .85; font-size: .85rem; }

  /* —— Prolog / Folio —— */
  #stage-prolog {
    width: min(960px, 96vw);
    margin: 0 auto 1.5rem;
  }
  .prolog-frame {
    display: grid;
    grid-template-columns: minmax(0, 1.05fr) minmax(0, .95fr);
    gap: 0;
    border-radius: 6px 10px 10px 6px;
    overflow: hidden;
    box-shadow:
      0 0 0 3px #1a0e08,
      0 0 0 6px var(--brass),
      0 25px 60px rgba(0,0,0,.65);
    background: #2a1810;
    max-height: 78vh;
  }
  .prolog-portrait {
    background: #1a120c;
    display: flex; align-items: center; justify-content: center;
    padding: .4rem;
    min-height: 280px;
  }
  .prolog-portrait img {
    width: 100%; height: 100%;
    max-height: 76vh;
    object-fit: contain;
    border-radius: 3px;
  }
  .prolog-text {
    background: linear-gradient(270deg, rgba(0,0,0,.06), transparent 14%), var(--parchment);
    color: var(--ink);
    padding: 1.2rem 1.35rem 1rem;
    overflow: auto;
    max-height: 78vh;
  }
  .prolog-text h2 {
    margin: 0 0 .75rem;
    font-size: 1.15rem;
    color: #5a3a18;
    border-bottom: 1px solid #c9a22766;
    padding-bottom: .4rem;
    letter-spacing: .04em;
  }
  .prolog-text .body {
    font-size: clamp(.78rem, 1.35vw, .95rem);
    line-height: 1.58;
    white-space: pre-wrap;
  }
  .prolog-nav {
    margin-top: 1rem;
    display: flex; justify-content: center;
  }
  .prolog-nav button {
    background: linear-gradient(180deg, #c9a227, #8a6a3a);
    color: #1a0e08;
    border: 1px solid #e8d08a;
    font-weight: 600;
    letter-spacing: .04em;
    padding: .65rem 1.4rem;
  }
  @media (max-width: 720px) {
    .prolog-frame {
      grid-template-columns: 1fr;
      grid-template-rows: auto 1fr;
      max-height: none;
    }
    .prolog-portrait { max-height: 42vh; }
    .prolog-portrait img { max-height: 40vh; }
    .prolog-text { max-height: 48vh; }
  }


  /* —— Folio audio —— */
  .btn-folio-read {
    background: linear-gradient(180deg, #e8d08a, #c9a227 45%, #8a6a3a);
    color: #1a0e08;
    border: 1px solid #f0e0a8;
    font-weight: 600;
    letter-spacing: .04em;
    padding: .65rem 1.25rem;
    border-radius: 4px;
    box-shadow: 0 2px 0 #5a3a18, 0 6px 16px rgba(0,0,0,.35);
    display: inline-flex; align-items: center; gap: .4rem;
  }
  .btn-folio-read.playing {
    background: linear-gradient(180deg, #8a6a3a, #5a3a22);
    color: var(--parchment);
    border-color: var(--gold);
  }
  .btn-folio-read .folio-note {
    font-size: .7rem; font-weight: 500; opacity: .75; letter-spacing: 0;
  }
  .prolog-nav { gap: .75rem; flex-wrap: wrap; align-items: center; }
  .prolog-nav button { /* keep existing */ }

  .folio-keeper {
    position: absolute;
    left: 2.5%;
    top: 8%;
    width: min(168px, 18%);
    z-index: 5;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: .45rem;
    pointer-events: none;
  }
  .folio-keeper > * { pointer-events: auto; }
  .folio-medallion {
    width: min(72px, 100%);
    aspect-ratio: 1;
    border-radius: 50%;
    overflow: hidden;
    border: 2px solid var(--gold);
    box-shadow:
      0 0 0 3px #1a0e08,
      0 0 0 5px #8a6a3a,
      0 8px 18px rgba(0,0,0,.55);
    background: #1a120c;
    flex-shrink: 0;
  }
  .folio-medallion img {
    width: 100%; height: 100%;
    object-fit: cover;
    object-position: center 18%;
    display: block;
  }
  .folio-speech {
    background: rgba(26, 14, 8, .78);
    border: 1px solid var(--brass);
    border-radius: 8px;
    padding: .45rem .55rem .45rem .6rem;
    color: var(--parchment);
    font-size: clamp(.62rem, 1.1vw, .78rem);
    line-height: 1.4;
    font-style: italic;
    text-align: left;
    max-width: 100%;
    backdrop-filter: blur(2px);
    display: flex;
    align-items: flex-start;
    gap: .4rem;
  }
  .folio-speech .folio-line { flex: 1; min-width: 0; }
  .folio-speak-btn {
    flex-shrink: 0;
    width: 1.7rem; height: 1.7rem;
    border-radius: 50%;
    border: 1px solid var(--gold);
    background: linear-gradient(180deg, #c9a227, #8a6a3a);
    color: #1a0e08;
    cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    padding: 0;
    font-size: .75rem;
    line-height: 1;
    box-shadow: 0 2px 6px rgba(0,0,0,.4);
  }
  .folio-speak-btn:hover { filter: brightness(1.1); }
  .folio-speak-btn.playing {
    background: linear-gradient(180deg, #8a6a3a, #5a3a22);
    color: var(--parchment);
  }
  @media (max-width: 720px) {
    .folio-keeper {
      left: 2%;
      top: 4%;
      width: min(42%, 150px);
      gap: .35rem;
    }
    .folio-medallion { width: 52px; }
    .folio-speech {
      font-size: .62rem;
      padding: .35rem .4rem;
    }
    .folio-speak-btn { width: 1.5rem; height: 1.5rem; font-size: .7rem; }
    .prolog-nav { flex-direction: column; }
    .btn-folio-read { width: min(100%, 280px); justify-content: center; }
  }

  .site-footer {
    margin-top: 2rem;
    padding: 1.25rem 1rem 1.5rem;
    text-align: center;
    font-size: .72rem;
    letter-spacing: .04em;
    opacity: .55;
    color: var(--parchment, #f3e6c8);
    border-top: 1px solid #5a3a2244;
  }

  @media (max-width: 720px) {
    .lang-switch { top: .5rem; right: .5rem; }
    header {
      padding: 2.8rem .75rem .35rem;
      padding-right: 4.25rem; /* clear DE/EN */
    }
    header h1 {
      font-size: clamp(.78rem, 3.6vw, .95rem);
      letter-spacing: .05em;
      line-height: 1.3;
      white-space: normal;
      overflow-wrap: anywhere;
    }
    header p { font-size: .78rem; }
    #stage-shelf {
      width: 96vw;
      aspect-ratio: auto;
      height: auto;
      overflow: visible;
      display: flex;
      flex-direction: column;
      border-radius: 8px;
    }
    #stage-table { aspect-ratio: 4/3; width: 96vw; min-height: 0; }
    .stage { min-height: 0; }
    .shelf-scene {
      aspect-ratio: 5/6;
      width: 100%;
      border-radius: 8px 8px 0 0;
      flex-shrink: 0;
    }
    .shelf-scene .bg {
      object-fit: cover;
      object-position: center 48%;
    }
    /* Folio below shelf image on mobile */
    #stage-shelf .folio-keeper {
      position: static;
      width: 100%;
      max-width: none;
      left: auto; top: auto;
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: .65rem;
      padding: .7rem .75rem .85rem;
      background: linear-gradient(180deg, #1a100a, #0d0805);
      border-top: 1px solid #5a3a2244;
      border-radius: 0 0 8px 8px;
      box-sizing: border-box;
      pointer-events: auto;
      z-index: 6;
    }
    #stage-shelf .folio-medallion { width: 56px; flex-shrink: 0; }
    #stage-shelf .folio-speech {
      flex: 1;
      max-width: none;
      font-size: .68rem;
      padding: .4rem .5rem;
    }
    .shelf-rows {
      left: 8%;
      right: 5%;
      bottom: 18%;
      height: 52%;
      top: auto;
      gap: 3%;
      overflow-x: auto;
    }
    .spine-row {
      min-height: 180px;
      height: 100%;
      gap: 6px;
    }
    .spine {
      --spine-w: clamp(44px, 11.5vw, 58px);
    }
    .spine.has-subtitle { --spine-w: clamp(50px, 13vw, 66px); }
    .spine-title { font-size: .82rem; letter-spacing: .14em; }
    .spine-subtitle { font-size: .5rem; letter-spacing: .08em; }
    #book-on-table {
      width: min(78vw, 72%);
      height: auto;

She waited. Women in our village waited a lot.

Then — the sound.

I had never heard an avalanche.
But I knew at once what it was.
Not because I knew it. Because my body knew.

The rumble. The growing. The silence afterwards that was louder than everything.

They found him under the snow.
He was still warm when they carried him.
That was the cruellest part.

Saw me.
Laughed.

A girl. Alone. Small. Platinum-white hair like a beacon in the dark.

He laughed louder.
Took a step forward.

My sword found him.

The blade in my hand. The blood on my cheek.

I did not cry.
I trembled.

Then I heard the other two outside.
I trembled no more.

I looked one last time at the house where I had grown up.

And I went.

Southward. Always southward.

What I saw — I will not write every detail.
Some things deserve no paper.

What I know: on that day I swore.

Never again fight for gold.
Never again fight for someone who uses people as tools.
Never again swing the blade for men who see glory in their destruction.

I slept near ruins.
An old temple, half sunk in sand.
I had seen a hundred better sleeping places.
But something drew me there.

In the middle of the night I woke.

Light. Pulsing. From a stone inside the ruin.

No fire. No moon. Something else.
Something I could not name.

I took the sword and went in.

The stone pulsed like a heartbeat.
Warm when I laid my hand on it.
And then —

Visions.

A girl with black hair and brown eyes — Filli — in a cursed forest.
A boy with green-blue eyes and a flame in his hand — Piri — in a ruin.
And Maya. The laugh that drives out darkness.

I saw us all.
Together.
In a white chamber of light.

And I saw myself — not as I knew myself.
Not the alone-child from the village.
Not the mercenary with the scar.
But the guardian.

Tall. Sure. Not alone.

When the light died — the stone was cold in my hand, now dark, now mine —
I sat long in the ruins and stared at the red moon.

Not from grief.

I am the warrior who walked through Gaul and the Alps and Corinth and carried a promise with her.

I am the scar on the right cheek.
I am the platinum-white braids that lash in the wind.
I am the sword with the Celtic knots that sings when it cuts the air.

And I am the guardian.

Not because I wanted it.
Because life shaped me into it.
As my father shaped the metal — in fire, with patience, with strength.

The pack is my family.
The first real one I ever had.
Maya with her laugh.
Filli with her quiet eyes.
Piri with his fire.

I hold them.
Not because I must.
Because I know what it means to be alone.
And I will never allow anyone in my pack to feel that again.

That is my promise.
That is who I am.

That is me.
Lilli.
Lilli.
The Blade from the North.

Decades passed. No book glowed. The master left, and Folio remained alone among the shelves.

const SPINES_PER_ROW = 14; // desktop; mobile uses fewer via CSS width

function renderSpines() {
  const host = document.getElementById("shelf-rows");
  if (!host) return;
  const u = UI[lang];
  host.innerHTML = "";
  const perRow = window.matchMedia("(max-width: 720px)").matches ? 8 : SPINES_PER_ROW;
  const rows = [];
  for (let i = 0; i < VOLUMES.length; i += perRow) {
    rows.push(VOLUMES.slice(i, i + perRow));
  }
  // column-reverse: first row in DOM = bottom shelf
  rows.forEach((group) => {
    const row = document.createElement("div");
    row.className = "spine-row";
    group.forEach((vol) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "spine " + (vol.status === "ready" ? "ready" : "soon");
      btn.dataset.id = vol.id;
      btn.style.background = vol.color;
      const title = (vol.title && vol.title[lang]) || vol.id;
      const subtitle = vol.subtitle ? (vol.subtitle[lang] || vol.subtitle.de || "") : "";
      const tip = vol.status === "ready"
        ? (u.openTitle || (subtitle ? title + " · " + subtitle : title))
        : (u.soonFull || u.soon);
      btn.title = tip;
      btn.setAttribute("aria-label", tip);
      if (vol.status !== "ready") btn.setAttribute("aria-disabled", "true");
      if (subtitle) btn.classList.add("has-subtitle");

      const emblem = document.createElement("div");
      emblem.className = "spine-emblem" + (vol.emblem ? "" : " empty");
      if (vol.emblem) {
        const img = document.createElement("img");
        img.src = vol.emblem;
        img.alt = "";
        emblem.appendChild(img);
      }
      btn.appendChild(emblem);

      const accent = document.createElement("div");
      accent.className = "spine-accent";
      btn.appendChild(accent);

      const titles = document.createElement("div");
      titles.className = "spine-titles";
      const t = document.createElement("span");
      t.className = "spine-title";
      t.textContent = title;
      titles.appendChild(t);
      if (subtitle) {
        const s = document.createElement("span");
        s.className = "spine-subtitle";
        s.textContent = subtitle;
        titles.appendChild(s);
      }
      btn.appendChild(titles);

      if (vol.status === "ready") {
        btn.addEventListener("click", () => {
          if (vol.href === "table") show("stage-table");
          else if (vol.href) window.location.href = vol.href;
        });
      }
      row.appendChild(btn);
    });
    host.appendChild(row);
  });
}


const FOLIO_AUDIO = {
  prolog: { de: "assets/folio_prolog_de.m4a", en: "assets/folio_prolog_en.m4a" },
  gruss:  { de: "assets/folio_gruss_de.m4a",  en: "assets/folio_gruss_en.m4a" }
};
const audioProlog = document.getElementById("audio-folio-prolog");
const audioGruss  = document.getElementById("audio-folio-gruss");
const btnProlog   = document.getElementById("btn-folio-prolog");
const btnGruss    = document.getElementById("btn-folio-gruss");
const labelProlog = document.getElementById("folio-prolog-label");
const noteProlog  = document.getElementById("folio-prolog-note");
const grussText   = document.getElementById("folio-gruss-text");

function folioSrcExists(rel) {
  // relative assets we ship; EN may be missing — detect via HEAD once cached in FOLO_OK
  return !!rel;
}
const FOLIO_OK = { prolog_en: null, gruss_en: null }; // null=unknown, true/false after probe

async function probeAsset(url) {
  try {
    const r = await fetch(url, { method: "HEAD", cache: "no-cache" });
    return r.ok;
  } catch (_) {
    // file:// or offline: try GET range-less tiny
    try {
      const r = await fetch(url, { method: "GET", cache: "force-cache" });
      return r.ok;
    } catch (e2) { return false; }
  }
}

async function ensureFolioProbes() {
  if (FOLIO_OK.prolog_en === null) FOLIO_OK.prolog_en = await probeAsset(FOLIO_AUDIO.prolog.en);
  if (FOLIO_OK.gruss_en === null)  FOLIO_OK.gruss_en  = await probeAsset(FOLIO_AUDIO.gruss.en);
}

function stopAudio(el) {
  if (!el) return;
  el.pause();
  try { el.currentTime = 0; } catch (_) {}
}

function stopAllFolio() {
  stopAudio(audioProlog);
  stopAudio(audioGruss);
  btnProlog.classList.remove("playing");
  btnProlog.setAttribute("aria-pressed", "false");
  btnGruss.classList.remove("playing");
  syncFolioLabels();
  renderSpines();
}

function syncFolioLabels() {
  const u = UI[lang];
  const playing = btnProlog.classList.contains("playing");
  labelProlog.textContent = playing ? u.folioPause : u.folioRead;
  grussText.textContent = u.folioGruss;
  btnGruss.title = u.folioSpeakTitle;
  btnGruss.setAttribute("aria-label", u.folioSpeakTitle);
}

async function resolvePrologSrc() {
  await ensureFolioProbes();
  if (lang === "en" && FOLIO_OK.prolog_en) {
    noteProlog.hidden = true;
    noteProlog.textContent = "";
    return FOLIO_AUDIO.prolog.en;
  }
  if (lang === "en" && !FOLIO_OK.prolog_en) {
    noteProlog.hidden = false;
    noteProlog.textContent = UI[lang].folioNoteDe;
  } else {
    noteProlog.hidden = true;
    noteProlog.textContent = "";
  }
  return FOLIO_AUDIO.prolog.de;
}

async function resolveGrussSrc() {
  await ensureFolioProbes();
  if (lang === "en" && FOLIO_OK.gruss_en) return FOLIO_AUDIO.gruss.en;
  return FOLIO_AUDIO.gruss.de;
}

async function togglePrologAudio() {
  if (btnProlog.classList.contains("playing") && !audioProlog.paused) {
    audioProlog.pause();
    btnProlog.classList.remove("playing");
    btnProlog.setAttribute("aria-pressed", "false");
    syncFolioLabels();
    return;
  }
  stopAudio(audioGruss);
  btnGruss.classList.remove("playing");
  const src = await resolvePrologSrc();
  if (audioProlog.getAttribute("src") !== src) {
    audioProlog.src = src;
  }
  try {
    await audioProlog.play();
    btnProlog.classList.add("playing");
    btnProlog.setAttribute("aria-pressed", "true");
    syncFolioLabels();
  } catch (err) {
    console.warn("Folio prolog play failed", err);
    stopAllFolio();
  }
}

async function toggleGrussAudio() {
  if (btnGruss.classList.contains("playing") && !audioGruss.paused) {
    audioGruss.pause();
    btnGruss.classList.remove("playing");
    return;
  }
  stopAudio(audioProlog);
  btnProlog.classList.remove("playing");
  btnProlog.setAttribute("aria-pressed", "false");
  syncFolioLabels();
  const src = await resolveGrussSrc();
  if (audioGruss.getAttribute("src") !== src) {
    audioGruss.src = src;
  }
  try {
    await audioGruss.play();
    btnGruss.classList.add("playing");
  } catch (err) {
    console.warn("Folio greeting play failed", err);
    btnGruss.classList.remove("playing");
  }
}

audioProlog.addEventListener("ended", () => {
  btnProlog.classList.remove("playing");
  btnProlog.setAttribute("aria-pressed", "false");
  syncFolioLabels();
});
audioProlog.addEventListener("pause", () => {
  if (audioProlog.ended || audioProlog.currentTime === 0) return;
  // user/OS pause — reflect UI if not ended
  if (!audioProlog.ended) {
    btnProlog.classList.remove("playing");
    btnProlog.setAttribute("aria-pressed", "false");
    syncFolioLabels();
  }
});
audioGruss.addEventListener("ended", () => btnGruss.classList.remove("playing"));
audioGruss.addEventListener("pause", () => {
  if (!audioGruss.ended) btnGruss.classList.remove("playing");
});

btnProlog.addEventListener("click", () => { togglePrologAudio(); });
btnGruss.addEventListener("click", (e) => { e.stopPropagation(); toggleGrussAudio(); });

function applyUI() {
  const u = UI[lang];
  document.documentElement.lang = lang;
  document.getElementById("hdr-title").textContent = u.title;
  document.getElementById("hdr-sub").textContent = u.sub;
  document.getElementById("table-caption").textContent = u.tableCaption;
  document.getElementById("btn-shelf").textContent = u.back;
  document.getElementById("prev").textContent = u.prev;
  document.getElementById("next").textContent = u.next;
  document.getElementById("btn-to-shelf").textContent = u.toShelf;
  document.getElementById("prolog-title").textContent = u.prologTitle;
  document.getElementById("prolog-body").textContent = PROLOG[lang];
  const fl = document.getElementById("btn-flip");
  if (fl) fl.textContent = u.flipLink;
  document.getElementById("lang-de").classList.toggle("active", lang === "de");
  document.getElementById("lang-en").classList.toggle("active", lang === "en");
  syncFolioLabels();
  renderSpines();
  const active = document.querySelector(".stage.active");
  if (active) show(active.id);
}

function show(id) {
  const prev = document.querySelector(".stage.active");
  document.querySelectorAll(".stage").forEach(s => s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  const u = UI[lang];
  if (id === "stage-prolog") hint.textContent = u.hintProlog;
  if (id === "stage-shelf") hint.textContent = u.hintShelf;
  if (id === "stage-table") hint.textContent = u.hintTable;
  if (id === "stage-open") hint.textContent = u.hintOpen;
  // Stop Folio when leaving the screen that owns the clip (never autoplay)
  if (prev && prev.id !== id) {
    if (prev.id === "stage-prolog" || id !== "stage-prolog") {
      if (id !== "stage-prolog") {
        stopAudio(audioProlog);
        btnProlog.classList.remove("playing");
        btnProlog.setAttribute("aria-pressed", "false");
      }
    }
    if (id !== "stage-shelf") {
      stopAudio(audioGruss);
      btnGruss.classList.remove("playing");
    }
    syncFolioLabels();
  }
}

  audioGruss.removeAttribute("src");
  applyUI();
  if (document.getElementById("stage-open").classList.contains("active")) renderPage();
}
document.getElementById("lang-de").onclick = () => setLang("de");
document.getElementById("lang-en").onclick = () => setLang("en");
prev.onclick = () => { if (pageIndex > 0) { pageIndex--; renderPage(); } };
next.onclick = () => { if (pageIndex < PAGES[lang].length - 1) { pageIndex++; renderPage(); } };
document.addEventListener("keydown", (e) => {
  if (e.key === "ArrowLeft") prev.click();
  if (e.key === "ArrowRight") next.click();
  if (e.key === "Escape") show("stage-shelf");
});
applyUI();
ensureFolioProbes();
let _spineResizeTimer;
window.addEventListener("resize", () => {
  clearTimeout(_spineResizeTimer);
  _spineResizeTimer = setTimeout(renderSpines, 150);
});
</script>
