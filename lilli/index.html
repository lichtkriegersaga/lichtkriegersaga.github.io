const PAGES = {
  de: [
  {
    type: "cover",
    img: "../assets/lilli_cover.jpg",
    label: "Cover"
  },
  {
    type: "spread",
    title: "I. Das Kind des Windes",
    text: `Es gibt Nächte in Norwegen, in denen der Wind nicht weht — er heult.
Nicht wie ein Sturm. Wie etwas Lebendes das Schmerz hat.

In einer solchen Nacht wurde ich geboren.

Die Hebamme sagte später, das Kind habe nicht geweint.
Es habe die Augen aufgemacht und den Wind angeschaut.
Als würde es ihn kennen.

Meine Mutter nannte mich Lilli.
Kurz. Hart. Wie ein Schwertstreich.
Sie hatte Hände wie die Klippen — rau, verlässlich, für immer salzig von der Arbeit.
Eine Fischerstochter die nie gelernt hatte, zart zu sein.
Aber wenn sie mich abends in den Armen hielt und sang —
dann war sie das Sanfteste das ich je kannte.

Mein Vater.

Ich muss einen Moment innehalten wenn ich an ihn denke.

Er war ein Schmied. Seine Arme waren aus Eisen.
Wenn er mich hochhob — ich, dieses winzige Ding mit platinweissem Haar —
war ich sicher wie nichts anderes auf dieser Erde sicher sein kann.

Er sah in meinen grünen Augen etwas.
Er sagte es nie direkt. Väter in unserem Dorf sagten solche Dinge nicht.
Aber abends, wenn ich neben ihm in der Schmiede sass und dem Feuer zuschaute,
legte er manchmal die Hand auf meinen Kopf und blieb still.

Als würde er beten.`,
    img: "../assets/lilli_p01.jpg",
    wide: true
  },
  {
    type: "spread",
    title: "II. Die Schmiede",
    text: `Ich war fünf als ich begann, ihm zuzuschauen.

Die Schmiede war meine erste Welt.
Der Geruch von heissem Metall und Holzkohle.
Das rhythmische Hämmern das ich schon im Bauch meiner Mutter gehört hatte.
Die orange-rote Glut die Schatten warf wie tanzende Geister.

Er liess mich den Blasebalg bedienen.
Meine kleinen Arme zogen und drückten, zogen und drückten.
Das Feuer lebte durch mich auf.

«Siehst du das?» sagte er einmal, ohne aufzuhören zu hämmern.
«Das Metall ist weich wenn es heiss ist. Dann kannst du es formen wie du willst. Wartest du bis es kalt ist — brichst du es wenn du zu hart drückst.»

Er schaute mich an.
«Menschen sind genauso. Vergiss das nicht.»

Ich verstand es damals nicht.
Ich verstand es mit vierzehn, als meine Klinge in einem Mann steckte.

Das Schwert — das Schwert meines Vaters — lag damals noch in der Schmiede.
Keltische Knoten im Griff, jeder mit einer Bedeutung die er mir nicht erklärte.
«Das kommt, wenn du bereit bist.»

Ich war nie bereit.
Das Leben wartete nicht auf Bereitschaft.`,
    img: "../assets/lilli_p02.jpg",
    wide: true
  },
  {
    type: "spread",
    title: "III. Die langen Winter",
    text: `Unser Dorf klammerte sich an die Felsen wie ein Ertrinkender an Treibholz.

Die Winter waren dunkel — nicht wie in den Süden, wo die Sonne nur müde wird.
Bei uns verschwand sie. Wochenlang. Monate.
Wir lebten im Grau, im Frost, im Hunger.

Ich lernte früh: die Welt gibt nichts umsonst.

Ich lernte Fische ausnehmen mit fünf Jahren.
Mit sechs konnte ich allein auf dem Eis laufen ohne zu fallen.
Mit sieben wusste ich welche Beeren im Wald giftig waren und welche nicht.
Meine Mutter lehrte mich diese Dinge ohne Drama —
als wären es Fakten wie das Wetter.
Weil sie es waren.

In unserem Dorf gab es keine verwöhnten Kinder.
Es gab Kinder die überlebten.
Und Kinder die nicht überlebten.

Ich überlebte.
Immer.
Auch dann, als ich es beinahe nicht wollte.`,
    img: "../assets/lilli_p03.jpg",
    wide: true
  },
  {
    type: "spread",
    title: "IV. Der Berg nimmt was ihm gehört",
    text: `Ich war zehn Jahre alt.

Es war Dezember. Der Schnee lag meterhoch.
Mein Vater war mit drei anderen Männern oben am Hang —
Holz holen für den Winter, für die Schmiede, für uns.

Ich weiss noch wie meine Mutter stand.
An der Tür unseres Hauses, die Hände um einen Becher geklammert.
Sie wartete. Frauen in unserem Dorf warteten viel.

Dann — das Geräusch.

Ich hatte noch nie eine Lawine gehört.
Aber ich wusste sofort was es war.
Nicht weil ich es kannte. Weil mein Körper es wusste.

Das Rumpeln. Das Wachsen. Das Schweigen danach das lauter war als alles.

Sie fanden ihn unter dem Schnee.
Er war noch warm als sie ihn trugen.
Das war das Grausamste.
Noch warm. Als hätte der Tod noch nicht verstanden was er getan hatte.

Die Schmiede war kalt an diesem Abend.
Ich sass allein darin bis meine Mutter mich holte.
Ich wollte das Feuer nicht sterben lassen.
Als wäre es noch er.`,
    img: "../assets/lilli_p04.jpg",
    wide: true
  },
  {
    type: "spread",
    title: "V. Das zweite Mal Abschied",
    text: `Zwei Winter später.

Meine Mutter hatte die ganze Zeit gehustet.
Ich hatte gelernt den Husten zu ignorieren.
Die anderen Dorfbewohner auch.
In unseren Breiten husteten die Menschen.

Dann hustete sie Blut.

Ich war zwölf.

Ich versuchte alles was ich wusste.
Warme Tücher. Kräuter. Wasser.
Ich blieb neben ihr wach, wachte Nacht um Nacht.

Sie starb trotzdem.

An einem Morgen im Februar als das Licht gerade grau und kalt durch das kleine Fenster fiel.
Sie hielt meine Hand.
Und dann hielt sie sie nicht mehr.

Ich war allein.

Nicht einsam — das ist etwas anderes.
Einsam ist wenn man Menschen hat aber trotzdem niemanden.
Allein ist wenn tatsächlich niemand mehr da ist.

Ich war zwölf Jahre alt.
Ich hatte ein kleines Haus, ein Schwert das zu gross für mich war, und Augen die nicht mehr weinen konnten.

Die Tränen kamen nicht.
Vielleicht wusste mein Körper dass ich sie noch brauchen würde.
Für die nächsten Jahre.`,
    img: "../assets/lilli_p05.jpg",
    wide: true
  },
  {
    type: "spread",
    title: "VI. Überleben",
    text: `Die erste Zeit war Instinkt.

Ich ass was ich finden konnte.
Ich schlief unter Fellen.
Ich lernte das Schwert meines Vaters zu heben.
Es war schwer. Meine Arme zitterten.

Jeden Tag wurden sie weniger zittrig.

Die Dorfbewohner halfen manchmal.
Eine alte Frau brachte mir Brot.
Ein Fischer liess mich sein Netz flicken — ich behielt einen Teil des Fangs.
Aber keiner nahm mich auf.

In unserem Dorf überlebte man allein oder man überlebte nicht.

Ich lernte die Wälder.
Welche Tiere kamen wohin.
Wo man schlafen konnte und sicher war.
Wie man ein Feuer machte auch wenn das Holz nass war.

Und ich lernte das Schwert.

Nicht von jemandem — von mir selbst.
Stundenlang täglich.
Ich schlug gegen Baumstämme bis meine Hände bluteten.
Dann heilten sie.
Dann schlug ich wieder.

Das Schwert meines Vaters wurde leichter.
Oder ich wurde stärker.
Beides, wahrscheinlich.`,
    img: "../assets/lilli_p06.jpg",
    wide: true
  },
  {
    type: "spread",
    title: "VII. Die Narbe",
    text: `Ich war vierzehn.

Es war Herbst. Ein Abend der nach nassem Holz und Verwesung roch.

Drei Männer kamen ins Dorf.
Keine Händler. Keine Reisenden.
Plünderer — die Sorte die auf Dörfer wartet bis die Männer fort sind.

Die ersten beiden gingen zu anderen Häusern.
Der dritte kam zu meinem.

Er öffnete die Tür.
Sah mich.
Lachte.

Ein Mädchen. Allein. Klein. Platinweisses Haar wie ein Leuchtsignal in der Dunkelheit.

Ich hatte das Schwert bereits in der Hand.

Er lachte lauter.
Trat einen Schritt vor.

Was dann geschah — ich werde es nicht verklären.
Es war nicht schön. Es war nicht mutig wie in Geschichten.
Es war Angst und Adrenalin und der Instinkt meiner Arme die zwei Jahre lang geübt hatten.

Er griff nach mir.
Seine Klinge streifte meinen linken Oberarm — flach, aber tief genug für eine Narbe.
Mein Schwert fand ihn.

Ich stand danach eine lange Zeit über ihm.
Die Klinge in der Hand. Das Blut an meinem Arm.
Das Feuer meines Vaters — das ich monatelang in Gedanken gehütet hatte —
war jetzt in mir.

Ich weinte nicht.
Ich zitterte.

Dann hörte ich die anderen beiden draussen.
Ich zitterte nicht mehr.

Sie gingen, als sie ihren Kameraden nicht fanden.
Drei Männer kommen — zwei gehen.
In unserem Dorf fragte niemand.

Ich sass die ganze Nacht am Feuer.
Die Narbe brannte.
Ich liess sie brennen.
Als Erinnerung.
Als Versprechen.`,
    img: "../assets/lilli_p07.jpg",
    wide: true
  },
  {
    type: "spread",
    title: "VIII. Der Weg nach Süden",
    text: `Mit fünfzehn verliess ich das Dorf.

Nicht weil man mich jagte. Nicht weil etwas Schlimmes geschah.
Einfach weil ich wusste: hier ist nichts mehr für mich.
Hier sind nur Erinnerungen.
Und Erinnerungen können einen töten wenn man zu lange darin lebt.

Ich nahm das Schwert meines Vaters.
Ich nahm so viel Proviant wie ich tragen konnte.
Ich schaute ein letztes Mal auf das Haus in dem ich aufgewachsen war.

Und ich ging.

Südwärts. Immer südwärts.
Weil Süden Wärme bedeutete. Welt. Menschen.
Und vielleicht — vielleicht — einen Zweck.

Die ersten Söldnerbanden die ich traf lachten über das Mädchen mit dem grossen Schwert.
Dann sahen sie mich kämpfen.
Sie hörten auf zu lachen.`,
    img: "../assets/lilli_p08.jpg",
    wide: true
  },
  {
    type: "spread",
    title: "IX. Was der Krieg lehrt",
    text: `Gallien lehrte mich Disziplin.

Die Römer — meine Feinde im Geiste, meine Lehrmeister in der Praxis —
hatten eine Kriegsführung wie eine Maschine.
Ordnung. Taktik. Geduld.

Ich hasste sie.
Und ich lernte von ihnen.

Ein alter gallischer Söldner namens Brennus — gross wie ein Baum, dumm wie ein Stein, weiser als er aussah —
zeigte mir was ich falsch machte.

«Du kämpfst wie ein Tier, Mädchen. Instinkt. Gut für Überraschungen. Schlecht für lange Schlachten.»

Er zeigte mir Atemkontrolle.
Wie man Ausdauer hält.
Wie man liest was ein Gegner tun wird bevor er es selbst weiss.

Die Alpen lehrten mich etwas anderes.

Stille. Geduld. Die Tatsache dass die Berge sich nicht kümmern ob du lebst oder stirbst.
Du passt dich an oder du verschwindest.
Und die Kälte — die Kälte die mich an zuhause erinnerte —
war meine älteste Freundin.`,
    img: "../assets/lilli_p09.jpg",
    wide: true
  },
  {
    type: "spread",
    title: "X. Corinth",
    text: `Ich war achtzehn als ich nach Corinth kam.

Die Römer zerstörten die Stadt 146 v. Chr.
Ich war dabei.

Nicht auf ihrer Seite. Nicht gegen sie.
Ich war... dazwischen.
Söldnerin. Zuschauerin. Zeugin.

Was ich sah — ich werde nicht alle Details schreiben.
Manche Dinge verdienen kein Papier.

Was ich weiss: an diesem Tag schwor ich.

Nie wieder für Gold kämpfen.
Nie wieder für jemanden kämpfen der Menschen als Werkzeug benutzt.
Nie wieder die Klinge für Männer schwingen die in ihrer Zerstörung Ruhm sehen.

Für wen dann?

Das wusste ich damals noch nicht.
Ich wusste nur: für etwas das grösser ist.
Ich wusste es noch nicht.
Aber es kam.`,
    img: "../assets/lilli_p10.jpg",
    wide: true
  },
  {
    type: "spread",
    title: "XI. Die Nacht der blutenden Monde",
    text: `Ich war zwanzig. Einundzwanzig. Die Jahre verschwimmen.

Es war eine Nacht in der das Mittelmeer schwarz lag und der Mond rot schimmerte —

let lang = localStorage.getItem("lilli_lang") || "de";
let i = 0;
const spread = document.getElementById("spread");
const stage = document.getElementById("stage");
const pager = document.getElementById("pager");
const prev = document.getElementById("prev");
const next = document.getElementById("next");

function applyUI() {
  const u = UI[lang];
  document.documentElement.lang = lang;
  document.getElementById("doc-title").textContent = u.title;
  document.getElementById("doc-sub").textContent = u.sub;
  document.getElementById("doc-hint").textContent = u.hint;
  prev.textContent = u.prev;
  const bh = document.getElementById("back-home");
  if (bh) bh.textContent = (lang === "de" ? "‹ Bücherwand" : "‹ Bookshelf");
  next.textContent = u.next;
  document.getElementById("lang-de").classList.toggle("active", lang === "de");
  document.getElementById("lang-en").classList.toggle("active", lang === "en");
}

// —— Hörspiel (Deutsch) – gelesen von Lilli, nur in der deutschen Ansicht ——
const HS_ROMAN = ["I","II","III","IV","V","VI","VII","VIII","IX","X","XI","XII"];
function hsChapterNo(p) {
  const m = /^([IVX]+)\./.exec((p && p.title) || "");
  return m ? HS_ROMAN.indexOf(m[1]) + 1 : 0;
}
function hsStop() {
  document.querySelectorAll("#spread audio").forEach(a => { try { a.pause(); } catch (_) {} });
}
function hsMount(p) {
  if (lang !== "de") return;
  const n = hsChapterNo(p);
  if (!n) return;
  const h2 = document.querySelector("#spread .page.left h2");
  if (!h2) return;
  const box = document.createElement("div");
  box.className = "hoerspiel";
  const nn = String(n).padStart(2, "0");
  box.innerHTML = `<span class="hs-label">🎧 Hörspiel (Deutsch) – gelesen von Lilli</span>` +
    `<audio controls preload="none" playsinline src="audio/hoerspiel/k${nn}_de.m4a" aria-label="Hörspiel Kapitel ${HS_ROMAN[n-1]}"></audio>`;
  const a = box.querySelector("audio");
  a.addEventListener("keydown", (e) => e.stopPropagation());
  h2.insertAdjacentElement("afterend", box);
}

function render() {
  hsStop();
  const pages = PAGES[lang];
  const p = pages[i];
  if (p.type === "cover") {
    stage.classList.remove("wide-mode");
    spread.className = "spread";
    spread.innerHTML = `<div class="page cover-wrap"><img src="${p.img}" alt="Cover"/></div>`;
  } else {
    const wide = !!p.wide;
    stage.classList.toggle("wide-mode", wide);
    spread.className = "spread" + (wide ? " landscape" : "");
    spread.innerHTML = `
      <div class="page left"><h2>${p.title}</h2><div class="body">${p.text}</div></div>
      <div class="page right"><img src="${p.img}" alt="${p.title}"/></div>`;
  }
  pager.textContent = `${i + 1} / ${pages.length}`;
  prev.disabled = i === 0;
  next.disabled = i === pages.length - 1;
  if (window.Sterne) Sterne.bookPage(document.getElementById("sterne-host"), "lilli", lang, i === pages.length - 1);
  hsMount(p);
}
function setLang(l) {
  lang = l;
  localStorage.setItem("lilli_lang", lang);
  applyUI();
  render();
}
document.getElementById("lang-de").onclick = () => setLang("de");
document.getElementById("lang-en").onclick = () => setLang("en");
prev.onclick = () => { if (i > 0) { i--; render(); } };
next.onclick = () => { if (i < PAGES[lang].length - 1) { i++; render(); } };
document.addEventListener("keydown", (e) => {
  if (e.key === "ArrowLeft") prev.click();
  if (e.key === "ArrowRight") next.click();
});
applyUI();
render();
