  "de": [
    {

      "img": "../assets/piri_cover.jpg",

    },
    {
      "type": "spread",
      "title": "I. Das Kind des Sturms",
      "text": "Es gibt Nächte in den Hügeln meiner Heimat, in denen der Himmel nicht donnert — er zerreisst.\n\nIn einer solchen Nacht wurde ich geboren.\n\nDie Blitze kamen so dicht, dass die Hebamme später sagte, die Hütte sei keinen Augenblick dunkel gewesen.\nUnd das Feuer in der Schmiede meines Vaters brannte heller als je zuvor.\nOhne dass jemand Holz nachgelegt hatte.\n\nIch weinte nicht.\nIch machte die Augen auf.\nNicht erschrocken. Aufmerksam.\nAls würde ich den Sturm draussen nicht fürchten — sondern erkennen.\n\nMeine Mutter war eine Seherin. Sie wusste, was Worte wiegen.\nSie schaute in meine Augen — grünblau, sagt man, wie ein Sturm über dem Meer —\nund flüsterte: \"Er kennt das Feuer. Er heisst Piri.\"\n\nMein Vater, der Schmied mit den narbigen Händen, hob mich ins Blitzlicht.\n\"Piri,\" wiederholte er.\nDer Funke.\n\nNicht weil er es sich wünschte.\nWeil er es sah.\n\nFeuer und Wasser. Sturm und Stille.\nDas war ich von Anfang an.\n",
      "img": "../assets/piri_p01.jpg",
      "wide": true
    },
    {
      "type": "spread",
      "title": "II. Zwischen zwei Welten",
      "text": "Unser Dorf lag zwischen zwei Mächten.\n\nAuf der einen Seite: Rom.\nLegionen, die marschierten. Strassen, die niemand bestellt hatte.\nGesetze, bei denen niemand gefragt wurde, ob er sie wollte.\n\nAuf der anderen Seite: die Druiden.\nAlte Männer in alten Wäldern.\nSie flüsterten von Göttern, die älter waren als die Wörter für sie.\n\nIch wuchs zwischen beiden auf.\nUnd gehörte zu keinem ganz.\n\nFür die Römer war ich ein Barbarenkind.\nFür die Druiden war da etwas in mir — zu stark, zu wild für ihre alten Pfade.\n\nNur mein Vater sah einfach mich.\n\nDie Schmiede war der einzige Ort, der beiden Welten gehörte und keiner.\nDort sass ich neben dem Amboss und schaute in die Glut.\n\n\"Feuer ist kein Feind und kein Freund,\" sagte er einmal und legte die Zange in die Kohlen.\n\"Feuer ist Möglichkeit. Es macht weich, was hart ist. Es formt, was formlos ist.\nAber es zerstört, was du ihm ohne Absicht gibst.\"\n\nEr schaute mich an.\n\"Der Unterschied zwischen Zerstörung und Erschaffung — das bist du. Deine Hand. Deine Geduld.\"\n\nIch war sechs.\nIch verstand es noch nicht.\nIch verstand es ein Jahr später.\n",
      "img": "../assets/piri_p02.jpg",
      "wide": true
    },
    {
      "type": "spread",
      "title": "III. Die erste Flamme",
      "text": "Ich war sieben.\n\nEin gewöhnlicher Morgen. Tau auf dem Gras. Rauch über den Dächern.\nIch sass vor der Schmiede und schaute auf meine Hände.\nMir war kalt.\n\nIch dachte nicht darüber nach.\nIch wünschte mir nur — einfach so — Wärme.\n\nUnd dann war sie da.\n\nEine kleine Flamme auf meiner linken Handfläche.\nBlau-weiss zuerst. Dann orange.\nRuhig. Sie brannte nicht. Sie wärmte nur.\n\nIch erschrak nicht.\nIch schaute sie an wie einen alten Freund, den man lange nicht gesehen hat.\nDa bist du ja.\n\nDie Nachbarn kamen. Dann das halbe Dorf.\nSie nannten es einen Segen.\nDie Druiden kamen aus dem Wald und sagten lange nichts.\n\nMein Vater sagte auch nichts.\nEr legte nur die Hand auf meine Schulter.\nSchwer. Warm. Still.\nIch spüre sie heute noch.\n\nDas Dorf sah einen Segen.\n\nDie Römer, die später kamen —\ndie sahen eine Bedrohung.\n",
      "img": "../assets/piri_p03.jpg",
      "wide": true
    },
    {
      "type": "spread",
      "title": "IV. Genau so viel wie nötig",
      "text": "Die Leute denken, Feuer sei Kraft.\n\nSie irren sich.\nFeuer ist Gefühl.\n\nJahrelang übte ich.\nWie gross. Wie heiss. Wie lang.\nWann es Wärme ist und wann es Schmerz.\nIch lernte: Feuer hört zu, wenn man die richtige Sprache spricht.\n\nMein Vater setzte mich an den Schleifstein.\n\"Eine Klinge schärft man nicht mit Kraft,\" sagte er.\n\"Der richtige Winkel. Der richtige Druck. Die richtige Zeit.\nZu viel — du nimmst das Metall weg. Zu wenig — du änderst nichts.\"\n\nIch sass stundenlang an diesem Stein.\nBis ich hörte, wann eine Schneide fertig war.\nBis ich spürte, wann das Metall genug hatte.\n\nGenau so viel wie nötig.\nNicht mehr. Nicht weniger.\n\nDas ist meine eigentliche Gabe, glaube ich.\nNicht die Flamme.\nZu spüren, was ein Ding braucht —\nund es dann zu geben.\n\nEine Klinge braucht den richtigen Winkel.\nEin Feuer braucht genug Luft.\nUnd ein Mensch — das lernte ich später —\nbraucht das richtige Wort zur richtigen Zeit.\n",
      "img": "../assets/piri_p04.jpg",
      "wide": true
    },
    {
      "type": "spread",
      "title": "V. Als die Römer kamen",
      "text": "Ich war zwölf.\n\nEs war Herbst. Die Wälder brannten in ihren eigenen Farben —\nrot, orange, gold.\nAls hätte die Welt gewusst, was kommt,\nund sich noch einmal in voller Pracht gezeigt.\n\nDie Römer kamen am Morgen.\n\nNicht die ganze Legion. Eine Einheit.\nDie Sorte, die Dörfer wie unseres als Problem sah.\nNicht als Menschen. Als Problem.\n\nEs ging schnell.\n\nMein Vater stellte sich vor die Schmiede.\nEr war kein Krieger. Er war ein Schmied.\nAber er hatte eine Frau und einen Sohn.\nEr hatte keine Wahl — und er wählte trotzdem.\n\nIch sah es.\n\nIch werde nicht aufschreiben, was ich sah.\nEs genügt, dass ich es sah.\nMit zwölf Jahren.\n\nUnd in dieser Sekunde wurde ich anders.\n\nNicht gebrochen.\nAnders.\n\nDie Glut in der Schmiede erlosch an diesem Tag.\nZum ersten Mal, solange ich lebte.\n",
      "img": "../assets/piri_p05.jpg",
      "wide": true
    },
    {
      "type": "spread",
      "title": "VI. Drei Tage ohne Flamme",
      "text": "Meine Mutter töteten sie nicht.\nSie nahmen sie mit.\n\nDas ist manchmal schlimmer.\nWeil man nicht weiss, wo sie ist.\nWeil die Hoffnung nie ganz aufhört, weh zu tun.\n\nIch hatte keine Zeit zu weinen.\nIch rannte.\n\nIn die Wälder. Das alte keltische Amulett meiner Familie in der Faust — ein Knoten aus Bronze, warm von meiner Hand.\nDas Einzige, was ich mitnahm.\n\nIch rannte, bis ich nicht mehr konnte.\nDann sass ich zwischen Baumwurzeln und öffnete die Hand.\n\nNichts.\n\nZum ersten Mal, seit ich sieben war: keine Flamme.\n\nIch starrte so lange auf meine Handfläche, bis ich es verstand.\nDie Flamme kommt nicht aus dem Nichts.\nSie kommt aus mir.\nUnd ich war leer.\n\nDie Nächte waren kalt.\nIch wartete.\n\nEinen Tag.\nZwei.\nDrei.\n\nDann — am dritten Morgen — ein Funke.\nKlein. Zitternd. Kaum mehr als ein Glimmen.\n\nAber er kam.\n\nIch schloss die Finger ganz vorsichtig darum.\nWie um etwas, das man nie wieder verlieren darf.\n",
      "img": "../assets/piri_p06.jpg",
      "wide": true
    },
    {
      "type": "spread",
      "title": "VII. Die Räume zwischen dem Licht",
      "text": "Was dann kam, lernte ich allein.\n\nNiemand zeigte es mir. Niemand hätte es gekonnt.\n\nIch entdeckte die Schatten.\nNicht die Dunkelheit — die Schatten.\nDie Räume zwischen dem Licht.\n\nWenn ich die Augen schloss und ganz still wurde,\nkonnte ich hindurchgehen.\nNicht weit. Nicht sicher, zuerst.\nEinmal landete ich in einem Bach statt hinter einem Baum.\n\nAber es reichte, um mich zu verstecken.\nEs reichte, um zu entkommen.\n\nUnd ich fand das Heilfeuer.\n\nEin Feuer, das nicht brennt.\nIch legte es auf meine aufgeschürften Knie, auf die Risse in meinen Händen —\nund die Haut schloss sich.\nLangsam. Mühsam.\nDanach schlief ich wie ein Stein.\n\nAber es funktionierte.\n\nIch war zwölf. Dreizehn. Vierzehn.\nIch lebte im Wald.\nMit einer Flamme, einem Amulett\nund Fähigkeiten, die ich mir nicht ausgesucht hatte.\n\nNachts, wenn es zu still war, liess ich die Flamme ein wenig grösser werden.\nNicht zum Wärmen.\nDamit etwas da war, das mit mir wach blieb.\n",
      "img": "../assets/piri_p07.jpg",
      "wide": true
    },
    {
      "type": "spread",
      "title": "VIII. Die Narbe die mich ehrlich hält",
      "text": "Mit sechzehn fand ich sie.\n\nEine kleine Gruppe. Kelten, Gallier, Überlebende.\nSie kämpften gegen Rom — nicht weil sie glaubten zu gewinnen.\nSondern weil Aufgeben schlimmer gewesen wäre als Kämpfen.\n\nIch kannte das Gefühl.\nIch blieb.\n\nMein erster richtiger Kampf dauerte kaum länger als ein Atemzug.\nEin Legionär. Ein Gladius. Eine Bewegung, die ich zu spät sah.\n\nDie Klinge streifte meinen Hals.\nFlach. Nicht tödlich.\nAber tief genug für eine Narbe, die ich jeden Morgen spüre, wenn ich schlucke.\n\nIch war wütend auf mich.\nDann dankbar.\n\nDenn das Feuer verführt.\nEs flüstert: Dir kann niemand etwas.\nMit sechzehn glaubt man das gern.\n\nDie Narbe widerspricht.\nJeden Tag.\nDu bist nicht unbesiegbar.\n\nIch brauchte diese Erinnerung.\nIch brauche sie heute noch.\n\nDas Feuer macht mich stark.\nDie Narbe hält mich ehrlich.\n",
      "img": "../assets/piri_p08.jpg",
      "wide": true
    },
    {
      "type": "spread",
      "title": "IX. Was Verlust aus mir machte",
      "text": "Ich hätte bitter werden können.\n\nVater tot. Mutter fort. Heimat verbrannt.\nEin Junge allein im Wald, mit einer Flamme, die manchmal nicht kommt.\nBitter wäre verständlich gewesen.\n\nStattdessen wurde ich — seltsamerweise — sanft.\n\nNicht weich. Nicht naiv.\nSanft.\n\nIch verstand etwas:\nWer zu viel verloren hat, will nicht, dass andere dasselbe erleben.\n\nAlso wurde ich der, der beschützt.\nNicht zuerst mit Gewalt — obwohl ich das kann.\nMit Voraussicht.\n\nVerlust schickt keine Warnung.\nDarum bin ich immer bereit.\nDarum kommt bei mir die Flamme zuerst — und die Fragen danach.\n\nDas ist nicht Wut.\nDas ist Liebe, die keine andere Form kennt.\n\nDie Rebellen zerstreuten sich irgendwann, wie Funken im Wind.\nIch wanderte weiter.\nVon Gallien hinauf bis Britannien. Und wieder zurück.\nDurch Nebel, durch Moor, durch Dörfer, die mir Brot gaben und keine Fragen stellten.\n\nImmer auf der Suche.\nOhne zu wissen, wonach.\n",
      "img": "../assets/piri_p09.jpg",
      "wide": true
    },
    {
      "type": "spread",
      "title": "X. Die Höhle der Ahnen",
      "text": "Ich war zweiundzwanzig.\n\nEin alter Mann in einem Dorf am Rand der Welt zeigte auf einen Hügel.\n\"Dort sind die Ahnen,\" sagte er. \"Geh hin, wenn du bereit bist.\"\n\nIch ging nicht sofort.\nDas hatte ich gelernt: Zu früh ist genauso schlecht wie zu spät.\n\nDie Höhle war tief und kalt und still.\nDie Geister — wenn es Geister waren — prüften mich nicht.\nSie empfingen mich.\nAls hätten sie auf mich gewartet.\n\nIm Innern: ein Stein.\nWarm wie eine Hand, die man kennt.\nAls wäre er immer schon meiner gewesen.\n\nDas vierte Zeitfragment.\n\nIch legte die Hand darauf.\n\nUnd sah sie.\n\nLilli. Die Kriegerin mit den silberweissen Zöpfen und dem Schwert.\nMaya. Kupferrotes Haar und ein Lachen, als gäbe es keine Dunkelheit.\nFilli. Die Stille, mit dunklem Haar und Augen, die mich lasen —\njemand, dem man sein Feuer anvertrauen könnte, ohne dass es zerstört.\n\nUnd mich. Das Feuer, das sie alle verbindet.\n\nIch weinte nicht. Ich lachte nicht.\nIch atmete.\nZum ersten Mal wirklich, seit mein Vater starb.\n\n\"Da seid ihr,\" sagte ich leise.\n",
      "img": "../assets/piri_p10.jpg",
      "wide": true
    },
    {

let lang = localStorage.getItem("piri_lang") || "de";
let i = 0;
const spread = document.getElementById("spread");
const stage = document.getElementById("stage");
const pager = document.getElementById("pager");
const prev = document.getElementById("prev");
const next = document.getElementById("next");

function esc(s) {
  return String(s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function applyUI() {
  const u = UI[lang];
  document.documentElement.lang = lang;
  document.getElementById("doc-title").textContent = u.title;
  document.getElementById("doc-sub").textContent = u.sub;
  document.getElementById("doc-hint").textContent = u.hint;
  prev.textContent = u.prev;
  const bh = document.getElementById("back-home");
  if (bh) bh.textContent = (lang === "de" ? "‹ Bücherwand" : "‹ Bookshelf");
  next.textContent = u.next;
  document.getElementById("lang-de").classList.toggle("active", lang === "de");
  document.getElementById("lang-en").classList.toggle("active", lang === "en");
}

function render() {
  const pages = PAGES[lang];
  const p = pages[i];
  if (p.type === "cover") {
    stage.classList.remove("wide-mode");
    spread.className = "spread";
    spread.innerHTML = `<div class="page cover-wrap"><img src="${esc(p.img)}" alt="Cover"/></div>`;
  } else {
    const wide = !!p.wide;
    stage.classList.toggle("wide-mode", wide);
    spread.className = "spread" + (wide ? " landscape" : "");
    spread.innerHTML = `
      <div class="page left"><h2>${esc(p.title)}</h2><div class="body">${esc(p.text)}</div></div>
      <div class="page right"><img src="${esc(p.img)}" alt="${esc(p.title)}"/></div>`;
  }
  pager.textContent = `${i + 1} / ${pages.length}`;
  prev.disabled = i === 0;
  next.disabled = i === pages.length - 1;
  if (window.Sterne) Sterne.bookPage(document.getElementById("sterne-host"), "piri", lang, i === pages.length - 1);
}
function setLang(l) {
  lang = l;
  localStorage.setItem("piri_lang", lang);
  applyUI();
  render();
}
document.getElementById("lang-de").onclick = () => setLang("de");
document.getElementById("lang-en").onclick = () => setLang("en");
prev.onclick = () => { if (i > 0) { i--; render(); } };
next.onclick = () => { if (i < PAGES[lang].length - 1) { i++; render(); } };
document.addEventListener("keydown", (e) => {
  if (e.key === "ArrowLeft") prev.click();
  if (e.key === "ArrowRight") next.click();
});
applyUI();
render();
</script>
